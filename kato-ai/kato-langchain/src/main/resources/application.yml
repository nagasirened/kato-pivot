server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: kato-langchain
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL

  datasource:
    url: jdbc:mysql://localhost:3306/kato_langchain?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO

logging:
  level:
    root: INFO
    com.kato.pro.langchain: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# ====== M2 Model Layer ======
minimax:
  api-key: ${MINIMAX_API_KEY:}
  base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  models:
    simple: m2.5
    complex: m3
  embedding:
    dimension: 512

# ====== M4 Memory ======
memory:
  window:
    max-tokens: 8000
    reserve-ratio: 0.1
  summary:
    trigger-threshold-tokens: 4000
    min-interval-seconds: 30

# ====== M5 RAG ======
rag:
  retriever:
    top-k: 5
    min-score: 0.6
  reranker:
    enabled: false
  query-rewriter:
    enabled: true
    cache-ttl-seconds: 86400

# ====== M6 Safety ======
safety:
  enabled: true
  local-keywords:
    enabled: true
    default-words:
      - 色情
      - 赌博
      - 毒品
  sensitive-client:
    enabled: false
    base-url: http://localhost:8081
    timeout-ms: 1000

# ====== M7 Tool Framework ======
tool:
  enabled: true
  default-timeout-ms: 1000
  cb-failure-threshold: 5
  cb-reset-ms: 30000
  audit-auto-approve: false

# ====== M8 ChatEngine ======
chat-engine:
  rag-top-k: 5
  rag-min-score: 0.6
  model-timeout-ms: 30000
  sse-timeout-ms: 30000
  tool-call-enabled: true

# ====== M9 Sync ======
sync:
  enabled: true
  cron: "0 0 */2 * * *"
  default-tenant: 1
  retry-times: 3
  keep-runs: 20

# ====== M10 OpenAPI / Knife4j ======
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
    swagger-model-name: 实体类列表

# ====== M11 Auth / Observability ======
jwt:
  secret: "kato-langchain-secret-key-must-be-at-least-32-bytes-long-for-hs256"
  ttl-seconds: 3600
  issuer: kato-langchain
  header: Authorization
  prefix: "Bearer "

alert:
  enabled: true
  interval-ms: 60000
  webhook-url: ""

kato:
  audit:
    file:
      enabled: false      # 生产开启：true 后每条审计追加一行 NDJSON 到 logs/op-audit.json
      path: logs/op-audit.json
      max-line-length: 8000

# ====== M16: Kato Config Refresh ======
kato:
  config:
    refresh:
      enabled: true
      # 业务方关心的 key（健康日志 / 监控用）
      watched-keys:
        kato.audit.file.enabled: "审计文件输出开关"
        chat-engine.rag-top-k: "RAG top-K"
        chat-engine.rag-min-score: "RAG 最小分数"

# ====== M17: Nacos Config Source（生产启用，沙箱默认关）======
kato:
  config:
    nacos:
      enabled: false        # 沙箱默认 false；生产开 true
      server-addr: ${NACOS_SERVER:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      group: ${NACOS_GROUP:DEFAULT_GROUP}
      data-ids:
        - kato-langchain-common
      timeout-ms: 10000
