server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: kato-langchain
  profiles:
    active: local
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: NON_NULL

  datasource:
    url: jdbc:mysql://localhost:3306/kato_langchain?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO

logging:
  level:
    root: INFO
    com.kato.pro.langchain: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# ====== M2 Model Layer ======
minimax:
  api-key: ${MINIMAX_API_KEY:}
  base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
  connect-timeout-ms: 5000
  read-timeout-ms: 60000
  models:
    simple: m2.5
    complex: m3
  embedding:
    dimension: 512
