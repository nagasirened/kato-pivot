server.port=8080

langchain4j.open-ai.chat-model.api-key=demo
langchain4j.open-ai.chat-model.base-url=http://langchain4j.dev/demo/openai/v1
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini

langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true
logging.level.root = debug


spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ==================== MiniMax Configuration ====================
# MiniMax API配置(请替换为您的实际API Key)
minimax.api-key=your-api-key-here
minimax.base-url=https://api.minimaxi.com
minimax.anthropic-url=https://api.minimaxi.com/anthropic

# 模型配置
minimax.text-model=MiniMax-M2.7
minimax.image-model=image-01
minimax.video-model=MiniMax-Hailuo-02
minimax.speech-model=speech-2.8-hd
minimax.music-model=music-2.6

# 超时配置(毫秒)
minimax.image-timeout=120000
minimax.video-timeout=300000